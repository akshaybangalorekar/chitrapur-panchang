name: Refresh panchang data

on:
  schedule:
    - cron: "45 23 * * *"   # 05:15 IST daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild data/panchang.json from the Math feeds
        run: python3 scripts/build_data.py

      - name: Commit if it changed
        run: |
          git config user.name "panchang-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/panchang.json
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "chore: refresh panchang data"
            git push
          fi
